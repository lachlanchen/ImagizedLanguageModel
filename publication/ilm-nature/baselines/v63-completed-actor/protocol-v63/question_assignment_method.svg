   <g id="text_6">
    <text style="font-size: 8.265px; font-family: 'Liberation Sans'; text-anchor: start; fill: #1d2b34" x="277.3125" y="95.708292" transform="rotate(-0 277.3125 95.708292)">Recorded answer Y1</text>
   </g>
   <g id="text_7">
    <text style="font-size: 6.96px; font-family: 'Liberation Sans'; text-anchor: start; fill: #677b87" x="26.1" y="113.358825" transform="rotate(-0 26.1 113.358825)">Each full prompt Xi also contains the same paragraph image. Appended white termination blocks are not drawn.</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 10.005px; font-family: 'Liberation Sans'; text-anchor: start; fill: #1d2b34" x="21.20625" y="134.487998" transform="rotate(-0 21.20625 134.487998)">b   Four causal likelihoods under the same parameters</text>
   </g>
   <g id="text_9">
    <text style="font-size: 9.135px; font-family: 'Liberation Sans'; fill: #1d2b34" transform="translate(46.857045 164.85127)">(X0, Y0)   (X0, Y1)</text>
    <text style="font-size: 9.135px; font-family: 'Liberation Sans'; fill: #1d2b34" transform="translate(46.857045 175.021808)">(X1, Y0)   (X1, Y1)</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9.57px; font-family: 'Liberation Sans'; fill: #1d2b34" transform="translate(189.824756 165.166509)">Shared image generator</text>
    <text style="font-size: 9.57px; font-family: 'Liberation Sans'; fill: #1d2b34" transform="translate(181.589323 175.821359)">490M parameters, 8 experts</text>
   </g>

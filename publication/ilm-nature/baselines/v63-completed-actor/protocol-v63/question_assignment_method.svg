    <text style="font-size: 12.18px; font-family: 'Liberation Sans'; text-anchor: middle; fill: #1d2b34" x="391.5" y="163.795444" transform="rotate(-0 391.5 163.795444)">e₀₀</text>
   </g>
   <g id="text_15">
    <text style="font-size: 12.18px; font-family: 'Liberation Sans'; text-anchor: middle; fill: #1d2b34" x="450.225" y="163.795444" transform="rotate(-0 450.225 163.795444)">e₀₁</text>
   </g>
   <g id="text_16">
    <text style="font-size: 8.7px; font-family: 'Liberation Sans'; text-anchor: middle; fill: #1d2b34" x="351.534375" y="182.153531" transform="rotate(-0 351.534375 182.153531)">X1</text>
   </g>
   <g id="text_17">
    <text style="font-size: 12.18px; font-family: 'Liberation Sans'; text-anchor: middle; fill: #1d2b34" x="391.5" y="184.022944" transform="rotate(-0 391.5 184.022944)">e₁₀</text>
   </g>
   <g id="text_18">
    <text style="font-size: 12.18px; font-family: 'Liberation Sans'; text-anchor: middle; fill: #1d2b34" x="450.225" y="184.022944" transform="rotate(-0 450.225 184.022944)">e₁₁</text>
   </g>
   <g id="text_19">
    <text style="font-size: 7.83px; font-family: 'Liberation Sans'; text-anchor: start; fill: #677b87" x="26.1" y="203.055553" transform="rotate(-0 26.1 203.055553)">eij = mean negative log likelihood of the complete answer suffix, including termination</text>
   </g>
   <g id="text_20">
    <text style="font-weight: 700; font-size: 10.005px; font-family: 'Liberation Sans'; text-anchor: start; fill: #1d2b34" x="21.20625" y="225.837998" transform="rotate(-0 21.20625 225.837998)">c   Positive image likelihood with paired question assignment</text>
   </g>
   <g id="text_21">
    <text style="font-size: 11.745px; font-family: 'Liberation Sans'; text-anchor: start; fill: #1d2b34" x="26.1" y="245.042705" transform="rotate(-0 26.1 245.042705)">D = e₀₁ + e₁₀ − e₀₀ − e₁₁</text>
   </g>
   <g id="text_22">
    <text style="font-size: 11.745px; font-family: 'Liberation Sans'; text-anchor: start; fill: #1d2b34" x="26.1" y="262.333955" transform="rotate(-0 26.1 262.333955)">L = (e₀₀ + e₁₁) / 2 + λ · 0.01 · softplus(−D / 0.01)</text>
   </g>
   <g id="text_23">
    <text style="font-size: 8.7px; font-family: 'Liberation Sans'; text-anchor: start; fill: #1d2b34" x="267.525" y="244.467281" transform="rotate(-0 267.525 244.467281)">λ = 0: control;  λ = 1: assignment</text>
   </g>
   <g id="text_24">
    <text style="font-size: 6.525px; font-family: 'Liberation Sans'; text-anchor: start; fill: #677b87" x="21.20625" y="282.041086" transform="rotate(-0 21.20625 282.041086)">Observed targets, not model outputs. Both arms start from the same V62 EMA; autonomous answers are evaluated separately.</text>
   </g>

   <g id="text_1">
    <text style="font-weight: 700; font-size: 13.92px; font-family: 'Liberation Sans'; text-anchor: start; fill: #1d2b34" x="14.68125" y="18.2439" transform="rotate(-0 14.68125 18.2439)">Question-conditioned image-language training</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 10.005px; font-family: 'Liberation Sans'; text-anchor: start; fill: #1d2b34" x="21.20625" y="44.769248" transform="rotate(-0 21.20625 44.769248)">a   Observed training images: two questions about one paragraph</text>
